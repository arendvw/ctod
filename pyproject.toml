[tool.poetry]
name = "CTOD"
version = "1.0.0"
description = "Cesium Terrain On Demand"
authors = ["tebben <ebben.tim@gmail.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.scripts]
start = "start_server:main"
dev = "start_server:main_dev"
seed_cache = "scripts.seed_cache:main"

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
morecantile = "^5.2.2"
rio-tiler = "^6.8.0"
pydelatin = "^0.4.0"
pymartini = "^0.6.0"
quantized-mesh-encoder = "^0.5.0"
fastapi = "^0.165.0"
triangle = "^20250106"
lxml = "^6.1.3"
uvicorn = {extras = ["standard"], version = "^0.54.0"}
requests = "^2.34.2"
psutil = "^7.2.2"
pyee = "^11.1.0"
aiosqlite = "^0.22.1"
aiohttp = "^3.14.5"
aiofiles = "^25.1.0"
jinja2 = "^3.1.6"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
