name: Smoke Test

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run container and capture logs
        run: |
          docker run -d --name ctod -p 5000:5000 ghcr.io/${{ github.repository }}:latest
          sleep 15
          echo "=== container state ==="
          docker inspect ctod --format '{{.State.Status}} exit={{.State.ExitCode}} restarts={{.RestartCount}}'
          echo "=== logs ==="
          docker logs ctod 2>&1 | tail -80
          echo "=== endpoint probes ==="
          fail=0
          for path in "/" "/status" "/tiles/demo/layer.json" "/tiles/demo/13/0/0.terrain"; do
            code=$(curl -s -m 30 -o /dev/null -w "%{http_code}" "http://localhost:5000$path")
            echo "$path -> $code"
            case "$code" in 2*|404) ;; *) fail=1;; esac
          done
          exit $fail
