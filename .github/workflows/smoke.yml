name: Smoke Test

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run container and capture logs
        run: |
          docker run -d --name ctod -p 5000:5000 ghcr.io/${{ github.repository }}:latest
          sleep 15
          echo "=== container state ==="
          docker inspect ctod --format '{{.State.Status}} exit={{.State.ExitCode}} restarts={{.RestartCount}}'
          echo "=== logs ==="
          docker logs ctod 2>&1 | tail -80
          echo "=== layer.json probe ==="
          curl -s -m 10 -o /dev/null -w "%{http_code}\n" "http://localhost:5000/" || true
